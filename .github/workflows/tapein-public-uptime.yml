name: Tape In public uptime

on:
  push:
    paths:
      - '.github/workflows/tapein-public-uptime.yml'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: tapein-public-uptime
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe Tape In public services
        id: probe
        shell: bash
        run: |
          set -o pipefail
          python3 - <<'PY'
          import json, time, urllib.request, urllib.error

          checks = [
              ("public-root", "https://tapein.ru/", None),
              ("cloud-ready", "https://tapein.ru/cloud-api/ready", None),
              ("setlist-ui", "https://tapein.ru/setlist/", None),
              ("setlist-health", "https://tapein.ru/setlist-api/health", '"version"'),
              ("music-notebook", "https://tapein.ru/music-notebook/", None),
              ("metronome", "https://tapein.ru/metr/", None),
              ("rehearsal", "https://tapein.ru/rehearsal/", None),
          ]
          out=[]
          failed=False
          for name,url,needle in checks:
              started=time.monotonic()
              status=0; body=""; err=None
              try:
                  req=urllib.request.Request(url,headers={"User-Agent":"TapeInGitHubUptime/1.0","Cache-Control":"no-cache"})
                  with urllib.request.urlopen(req,timeout=12) as r:
                      status=int(r.status)
                      body=r.read(262144).decode("utf-8","replace")
              except urllib.error.HTTPError as e:
                  status=int(e.code); err=f"HTTPError {e.code}"
              except Exception as e:
                  err=f"{type(e).__name__}: {e}"
              latency_ms=round((time.monotonic()-started)*1000)
              ok=(status==200 and (needle is None or needle in body))
              failed |= not ok
              out.append({"name":name,"url":url,"status":status,"latency_ms":latency_ms,"content_check":needle,"ok":ok,"error":err})
          report={"checked_at_utc":time.strftime("%Y-%m-%dT%H:%M:%SZ",time.gmtime()),"ok":not failed,"checks":out}
          print(json.dumps(report,ensure_ascii=False,indent=2))
          open('/tmp/tapein-uptime.json','w').write(json.dumps(report,ensure_ascii=False,indent=2))
          raise SystemExit(1 if failed else 0)
          PY

      - name: Open or close uptime incident
        if: always()
        uses: actions/github-script@v7
        env:
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
        with:
          script: |
            const fs = require('fs');
            const title = '[UPTIME] Tape In public probes failing';
            let report = '{}';
            try { report = fs.readFileSync('/tmp/tapein-uptime.json', 'utf8'); } catch (_) {}
            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            const incident = openIssues.find(i => !i.pull_request && i.title === title);
            if (process.env.PROBE_OUTCOME !== 'success') {
              const body = `External black-box probe detected a Tape In outage or degraded endpoint.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n\`\`\`json\n${report}\n\`\`\``;
              if (incident) {
                await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: incident.number, body});
              } else {
                await github.rest.issues.create({owner: context.repo.owner, repo: context.repo.repo, title, body});
              }
            } else if (incident) {
              await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: incident.number, body: `RECOVERED. All public probes passed.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});
              await github.rest.issues.update({owner: context.repo.owner, repo: context.repo.repo, issue_number: incident.number, state: 'closed', state_reason: 'completed'});
            }
