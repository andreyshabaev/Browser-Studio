name: Tape In public uptime

on:
  push:
    paths:
      - '.github/workflows/tapein-public-uptime.yml'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: tapein-public-uptime
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe Tape In public services and break-glass
        id: probe
        shell: bash
        run: |
          set -o pipefail
          python3 - <<'PY'
          import datetime as dt
          import json
          import time
          import urllib.error
          import urllib.request

          checks = [
              ("public-root", "https://tapein.ru/", None),
              ("cloud-ready", "https://tapein.ru/cloud-api/ready", None),
              ("setlist-ui", "https://tapein.ru/setlist/", None),
              ("setlist-health", "https://tapein.ru/setlist-api/health", '"version"'),
              ("music-notebook", "https://tapein.ru/music-notebook/", None),
              ("metronome", "https://tapein.ru/metr/", None),
              ("rehearsal", "https://tapein.ru/rehearsal/", None),
          ]

          out = []
          failed = False

          def fetch(url, timeout=12):
              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "TapeInGitHubUptime/2.0",
                      "Cache-Control": "no-cache",
                      "Pragma": "no-cache",
                  },
              )
              with urllib.request.urlopen(req, timeout=timeout) as r:
                  return int(r.status), r.read(262144).decode("utf-8", "replace")

          for name, url, needle in checks:
              started = time.monotonic()
              status = 0
              body = ""
              err = None
              try:
                  status, body = fetch(url)
              except urllib.error.HTTPError as e:
                  status = int(e.code)
                  err = f"HTTPError {e.code}"
              except Exception as e:
                  err = f"{type(e).__name__}: {e}"
              latency_ms = round((time.monotonic() - started) * 1000)
              ok = status == 200 and (needle is None or needle in body)
              failed |= not ok
              out.append({
                  "name": name,
                  "url": url,
                  "status": status,
                  "latency_ms": latency_ms,
                  "content_check": needle,
                  "ok": ok,
                  "error": err,
              })

          # Independent break-glass readiness check. This path is intentionally
          # outside QueueV2, Control SQLite and /agent-results.
          rescue_url = f"https://tapein.ru/__tapein-rescue/status.json?cb={time.time_ns()}"
          started = time.monotonic()
          status = 0
          err = None
          rescue = None
          age_seconds = None
          try:
              status, body = fetch(rescue_url)
              rescue = json.loads(body)
              checked = dt.datetime.fromisoformat(str(rescue.get("checked_at") or "").replace("Z", "+00:00"))
              if checked.tzinfo is None:
                  raise ValueError("checked_at is not timezone-aware")
              age_seconds = max(0.0, (dt.datetime.now(dt.timezone.utc) - checked.astimezone(dt.timezone.utc)).total_seconds())
          except urllib.error.HTTPError as e:
              status = int(e.code)
              err = f"HTTPError {e.code}"
          except Exception as e:
              err = f"{type(e).__name__}: {e}"

          sys = (rescue or {}).get("system") or {}
          rescue_ok = (
              status == 200
              and isinstance(rescue, dict)
              and rescue.get("schema") == "tapein.rescue.result/3"
              and rescue.get("agent") == "4.0"
              and rescue.get("command_transport") == "SIGNED_SINGLE_ENVELOPE_V1"
              and rescue.get("status") in {"IDLE", "PASS", "BOOTSTRAP_PASS"}
              and age_seconds is not None
              and age_seconds <= 180
              and sys.get("rescue_timer") == "active"
              and sys.get("rescue_timer_enabled") == "enabled"
              and sys.get("rescue_route_present") is True
              and (sys.get("nginx_test") or {}).get("ok") is True
          )
          failed |= not rescue_ok
          out.append({
              "name": "os-break-glass-rescue",
              "url": "https://tapein.ru/__tapein-rescue/status.json",
              "status": status,
              "latency_ms": round((time.monotonic() - started) * 1000),
              "ok": rescue_ok,
              "error": err,
              "agent": (rescue or {}).get("agent"),
              "command_transport": (rescue or {}).get("command_transport"),
              "rescue_status": (rescue or {}).get("status"),
              "age_seconds": None if age_seconds is None else round(age_seconds, 1),
              "rescue_timer": sys.get("rescue_timer"),
              "rescue_timer_enabled": sys.get("rescue_timer_enabled"),
              "rescue_route_present": sys.get("rescue_route_present"),
              "nginx_test_ok": (sys.get("nginx_test") or {}).get("ok"),
              "mutation": "none",
          })

          report = {
              "checked_at_utc": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
              "ok": not failed,
              "checks": out,
          }
          print(json.dumps(report, ensure_ascii=False, indent=2))
          open('/tmp/tapein-uptime.json', 'w').write(json.dumps(report, ensure_ascii=False, indent=2))
          raise SystemExit(1 if failed else 0)
          PY

      - name: Open or close uptime incident
        if: always()
        uses: actions/github-script@v7
        env:
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
        with:
          script: |
            const fs = require('fs');
            const title = '[UPTIME] Tape In public probes failing';
            let report = '{}';
            try { report = fs.readFileSync('/tmp/tapein-uptime.json', 'utf8'); } catch (_) {}
            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            const incident = openIssues.find(i => !i.pull_request && i.title === title);
            if (process.env.PROBE_OUTCOME !== 'success') {
              const body = `External black-box probe detected a Tape In outage, degraded endpoint, or break-glass readiness failure.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n\`\`\`json\n${report}\n\`\`\``;
              if (incident) {
                await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: incident.number, body});
              } else {
                await github.rest.issues.create({owner: context.repo.owner, repo: context.repo.repo, title, body});
              }
            } else if (incident) {
              await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: incident.number, body: `RECOVERED. All public and break-glass probes passed.\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});
              await github.rest.issues.update({owner: context.repo.owner, repo: context.repo.repo, issue_number: incident.number, state: 'closed', state_reason: 'completed'});
            }
